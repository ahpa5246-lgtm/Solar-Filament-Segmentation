[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-filament-challenge"
version = "0.1.0"
description = "Reproducible instance segmentation research pipeline for MAGFiLO"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["solar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
