name: Prepare private final checkpoints for candidate test inference
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-v5-final-cache.yml'
      - 'scripts/prepare_v5_final_cache.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v5-final-cache
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE }}
      KAGGLE_USERNAME: minahussain111
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official CLI and fingerprint-validation dependencies
        run: |
          python -m pip install 'git+https://github.com/Kaggle/kaggle-cli.git@2076e087da9fb8186636d2fe4d8c9f8cf6c56ac9' numpy==1.26.4 scipy==1.13.1 opencv-python-headless==4.10.0.84 pycocotools==2.0.8
          python -m pip install -e . --no-deps
      - name: Create private cache, without modifying original artifacts
        run: python scripts/prepare_v5_final_cache.py
      - name: Persist provenance and aggregate execution report only
        if: ${{ always() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f reports/V5_FINAL_CACHE.json ]; then git add reports/V5_FINAL_CACHE.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record private V5 cache and CPU replay provenance [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
