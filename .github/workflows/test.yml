name: Unit Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU test dependencies
        run: |
          python -m pip install torch==2.6.0+cpu torchvision==0.21.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-v6.txt
          python -m pip install -e . --no-deps
      - name: Run unit tests (no Kaggle data needed)
        run: OMP_NUM_THREADS=2 python -m pytest -q
