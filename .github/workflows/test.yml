name: Unit Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU test dependencies
        run: |
          python -m pip install torch==2.6.0+cpu torchvision==0.21.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-v6.txt setuptools==75.8.0 wheel==0.45.1
          python -m pip install -e . --no-deps
      - name: Run unit tests (no Kaggle data needed)
        run: OMP_NUM_THREADS=2 python -m pytest -ra --junitxml=artifacts/unit-tests.xml
      - name: Verify installed wheel and execute default notebook outside checkout
        run: OMP_NUM_THREADS=2 python scripts/verify_repository.py --out artifacts/cpu-delivery-verification.json
      - name: Reproduce Kaggle COCO binary preflight on CPU
        run: |
          python -m pip install 'pycocotools==2.0.11'
          python - <<'PY'
          import numpy as np
          from pycocotools import mask as coco
          a=np.zeros((64,64),dtype=np.uint8)
          a[12:17,30:35]=1
          rle=coco.encode(np.asfortranarray(a))
          assert int(coco.area(rle))==25
          assert np.array_equal(coco.decode(rle),a)
          assert np.array_equal(coco.decode(coco.merge([rle])),a)
          print("COCO binary NumPy encode/decode/merge/area smoke PASS")
          PY
      - name: Smoke-test isolated final NumPy ABI without Kaggle or GPU
        run: |
          python -m venv --system-site-packages "$RUNNER_TEMP/solar-final-abi"
          "$RUNNER_TEMP/solar-final-abi/bin/python" -m pip install -q --no-deps --ignore-installed \
            numpy==1.26.4 scipy==1.13.1 opencv-python-headless==4.10.0.84 pycocotools==2.0.11
          "$RUNNER_TEMP/solar-final-abi/bin/python" - <<'PY'
          import sys
          from pathlib import Path
          import numpy as np
          import numpy.rec
          import cv2
          import scipy
          import torch
          from pycocotools import mask as coco
          assert np.__version__ == '1.26.4'
          assert Path(np.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          mask = np.zeros((16, 16), dtype=np.uint8)
          mask[2:5, 4:7] = 1
          rle = coco.encode(np.asfortranarray(mask))
          assert int(coco.area(rle)) == 9
          assert np.array_equal(coco.decode(rle), mask)
          print('Isolated final NumPy/COCO ABI smoke PASS')
          PY
      - name: Preserve verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cpu-verification-evidence
          path: artifacts/*
          if-no-files-found: warn
