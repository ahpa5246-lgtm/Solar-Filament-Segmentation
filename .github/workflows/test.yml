name: Unit Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU test dependencies
        run: |
          python -m pip install torch==2.6.0+cpu torchvision==0.21.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-v6.txt setuptools==75.8.0 wheel==0.45.1
          python -m pip install -e . --no-deps
      - name: Run unit tests (no Kaggle data needed)
        run: OMP_NUM_THREADS=2 python -m pytest -ra --junitxml=artifacts/unit-tests.xml
      - name: Verify installed wheel and execute default notebook outside checkout
        run: OMP_NUM_THREADS=2 python scripts/verify_repository.py --out artifacts/cpu-delivery-verification.json
      - name: Reproduce Kaggle COCO binary preflight on CPU
        run: |
          python -m pip install 'pycocotools==2.0.11'
          python - <<'PY'
          import numpy as np
          from pycocotools import mask as coco
          a=np.zeros((64,64),dtype=np.uint8)
          a[12:17,30:35]=1
          rle=coco.encode(np.asfortranarray(a))
          assert int(coco.area(rle))==25
          assert np.array_equal(coco.decode(rle),a)
          assert np.array_equal(coco.decode(coco.merge([rle])),a)
          print("COCO binary NumPy encode/decode/merge/area smoke PASS")
          PY
      - name: Preserve verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cpu-verification-evidence
          path: artifacts/*
          if-no-files-found: warn
