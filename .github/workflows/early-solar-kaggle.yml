name: Kaggle accelerated solar challenger (single research attempt)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/early-solar-kaggle.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: solar-early-kaggle-day02
  cancel-in-progress: false

jobs:
  early:
    runs-on: ubuntu-latest
    timeout-minutes: 145
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE }}
      KAGGLE_USERNAME: minahussain111
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify bounded finite date, private notebook, no double launch
        run: |
          python -m pip install pytest==8.3.4
          python -m pytest -q tests/test_early_kaggle_challenger.py tests/test_auto14.py tests/test_kaggle_coco_compat.py
      - name: Install official pinned Kaggle CLI
        run: python -m pip install 'git+https://github.com/Kaggle/kaggle-cli.git@2076e087da9fb8186636d2fe4d8c9f8cf6c56ac9'
      - name: Launch exactly one early private day-two GPU notebook
        run: python scripts/early_kaggle_challenger_once.py
      - name: Preserve only sanitized private training aggregate
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f reports/AUTO14_STATE.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/AUTO14_STATE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record early real Kaggle model attempt [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Research summary
        if: always()
        run: |
          echo '## Direct Kaggle GPU training attempt' >> "$GITHUB_STEP_SUMMARY"
          echo 'Early day-two notebook is private, one-off, quota-bounded.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No competition submission or claim of a new official PQ score.' >> "$GITHUB_STEP_SUMMARY"
          echo 'See reports/AUTO14_STATE.json and Kaggle solar-autoresearch-d02.' >> "$GITHUB_STEP_SUMMARY"
