name: Audit immutable V5 and official evaluator (no GPU)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-v5.yml'
      - 'scripts/audit_v5_source.py'
      - 'tests/test_v5_source_audit.py'
      - 'scripts/inspect_v5_identity.py'
      - 'tests/test_v5_identity.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned official CLI and check source audit
        run: |
          python -m pip install 'git+https://github.com/Kaggle/kaggle-cli.git@2076e087da9fb8186636d2fe4d8c9f8cf6c56ac9' pytest==8.3.4
          python -m pytest tests/test_v5_source_audit.py tests/test_v5_identity.py -q
      - name: Inspect notebook identity and bounded version references
        run: python scripts/inspect_v5_identity.py
      - name: Retrieve and diagnose source access (never run GPU training)
        run: |
          python - <<'PYCODE'
          import os, pathlib, re, subprocess
          summary=pathlib.Path(os.environ['GITHUB_STEP_SUMMARY'])
          failures=[]
          diagnostic=pathlib.Path('reports/V5_SOURCE_ACCESS.md')
          diagnostic.write_text('# V5 source retrieval diagnostics\n\nSanitized CLI responses only; no model outputs or credentials.\n\n')
          for name,slug,folder in [
              ('V5 Version 5','minahussain111/solar-filament-research-v5/v5','/tmp/v5-source'),
              ('V5 Version 5 output inventory','minahussain111/solar-filament-research-v5/v5','/tmp/v5-output-inventory'),
              ('V5 Version 5 small output retrieval','minahussain111/solar-filament-research-v5/v5','/tmp/v5-small-output'),
              ('Latest V5 source (NOT Version 5 provenance)','minahussain111/solar-filament-research-v5','/tmp/v5-latest-source'),
              ('Official evaluation','azimahmadzadeh/self-evaluation-notebook','/tmp/official-source')]:
              pathlib.Path(folder).mkdir(parents=True,exist_ok=True)
              command=['kaggle','kernels','files',slug,'--csv','--page-size','200'] if name=='V5 Version 5 output inventory' else ['kaggle','kernels','pull',slug,'-p',folder]
              if name=='V5 Version 5 small output retrieval':
                  command=['kaggle','kernels','output',slug,'--file-pattern',r'.*\.(json|csv|log|txt)$','-p',folder]
              result=subprocess.run(command,capture_output=True,text=True)
              output=result.stdout+'\n'+result.stderr
              token=os.environ.get('KAGGLE_API_TOKEN','')
              if token: output=output.replace(token,'[REDACTED]')
              output=re.sub(r'KGAT_[A-Za-z0-9_-]+','[REDACTED]',output)
              output='\n'.join(line for line in output.splitlines() if not re.search(r'authorization|api.token|password|secret',line,re.I))
              message=f'## {name}: exit {result.returncode}\n\n```text\n{output[-5000:]}\n```\n'
              with summary.open('a') as handle: handle.write(message)
              with diagnostic.open('a') as handle: handle.write(message)
              if result.returncode: failures.append(name)
              if name=='V5 Version 5 small output retrieval':
                  files=[path for path in pathlib.Path(folder).rglob('*') if path.is_file()]
                  import json
                  inventory=[{'name':str(path.relative_to(folder)),'bytes':path.stat().st_size} for path in files]
                  pathlib.Path('reports/V5_OUTPUT_INVENTORY.json').write_text(json.dumps({'version':'v5','filter':'json,csv,log,txt only; weights excluded','files':inventory},indent=2)+'\n')
                  from scripts.audit_v5_source import _redact
                  logs=[]
                  for path in files:
                      if path.suffix=='.log':
                          text=path.read_text(errors='replace')
                          if token: text=text.replace(token,'[REDACTED]')
                          logs.append('## '+path.name+'\n\n```text\n'+_redact(text)[:5000]+'\n```\n')
                  pathlib.Path('reports/V5_LOG_REVIEW.md').write_text('# V5 v5 execution-log review\n\nSanitized log excerpts; no score is inferred from session status or startup output.\n\n'+'\n'.join(logs))
              if name=='V5 Version 5' and result.returncode==0:
                  import json, hashlib
                  from scripts.audit_v5_source import _source, _redact
                  paths=list(pathlib.Path(folder).glob('*.ipynb'))
                  if len(paths)==1:
                      raw=paths[0].read_bytes(); notebook=json.loads(raw)
                      expected='262946128a7838a5899c2b7966217f796c3a8059f1cb55ee2b5df283e075e13e'
                      if hashlib.sha256(raw).hexdigest()!=expected: raise RuntimeError('Immutable V5 source hash changed; refusing snapshot')
                      if re.search(rb'KGAT_[A-Za-z0-9_-]{8,}',raw): raise RuntimeError('Credential-shaped source found; refusing snapshot')
                      if b'Apache' not in raw: raise RuntimeError('Missing baseline attribution; refusing snapshot')
                      snapshot=pathlib.Path('notebooks/baselines/v5_version5.ipynb')
                      snapshot.parent.mkdir(parents=True,exist_ok=True)
                      if snapshot.exists() and snapshot.read_bytes()!=raw: raise RuntimeError('Baseline snapshot already differs; refusing overwrite')
                      snapshot.write_bytes(raw)
                      terms=['all_dice','best_strategy','use_refiner','train_observations','validation_observations','train_test_split','random_state','score_threshold','mask_threshold','merge_overlapping_rles']
                      lines=[line for cell in notebook.get('cells',[]) if cell.get('cell_type')=='code' for line in _source(cell).splitlines() if any(term in line for term in terms)]
                      review=pathlib.Path('reports/V5_VERSION5_SOURCE_REVIEW.md')
                      review.write_text('# V5 Version 5 source review\n\nVersion label `v5` verified with the official SDK; session status COMPLETE. Source download may omit execution outputs; no accuracy inferred.\n\nSHA256: `'+hashlib.sha256(raw).hexdigest()+'`\n\nSelected source statements for forensic review (not executed):\n\n```python\n'+_redact('\n'.join(lines))[:18000]+'\n```\n')
              if name=='Official evaluation' and result.returncode==0:
                  import json, hashlib, ast
                  from scripts.audit_v5_source import _source, _redact
                  paths=list(pathlib.Path(folder).glob('*.ipynb'))
                  if len(paths)==1:
                      raw=paths[0].read_bytes(); notebook=json.loads(raw)
                      excerpts=[]
                      for cell in notebook.get('cells',[]):
                          code=_source(cell)
                          if cell.get('cell_type')=='code' and any(term in code.lower() for term in ['def ','panoptic','iou','dice']):
                              excerpts.append(_redact(code))
                      tree=ast.parse('\n\n'.join(excerpts))
                      names={'get_overlap_matrices','fp_count_hit','fn_count_hit','rles_to_layers','process_entry','get_overlap_df','get_pq_score'}
                      nodes=[]
                      for node in tree.body:
                          if isinstance(node,ast.FunctionDef) and node.name in names:
                              if isinstance(node.body[0],ast.Expr) and isinstance(node.body[0].value,ast.Constant) and isinstance(node.body[0].value.value,str): node.body=node.body[1:]
                              nodes.append(node)
                      quoted=ast.unparse(ast.Module(body=nodes,type_ignores=[]))
                      review=pathlib.Path('reports/OFFICIAL_EVALUATOR_EXCERPTS.md')
                      review.write_text('# Official evaluator: source-review excerpts\n\nPublic reference: https://www.kaggle.com/code/azimahmadzadeh/self-evaluation-notebook\n\nQuoted solely for scientific evaluation review, not executed or incorporated into model code.\n\nSHA256: `'+hashlib.sha256(raw).hexdigest()+'`\n\n```python\n'+quoted[:24000]+'\n```\n')
          if not failures:
              subprocess.run(['python','scripts/audit_v5_source.py','--v5','/tmp/v5-source','--official','/tmp/official-source','--out','/tmp/source-audit.md'],check=True)
              with summary.open('a') as handle: handle.write(pathlib.Path('/tmp/source-audit.md').read_text())
          else:
              raise SystemExit('Source retrieval blocked: '+', '.join(failures))
          PYCODE
      - name: Persist sanitized access diagnostics for repository review
        if: ${{ always() }}
        run: |
          if [ ! -f reports/V5_SOURCE_ACCESS.md ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/V5_SOURCE_ACCESS.md
          if [ -f reports/V5_LOG_REVIEW.md ]; then git add reports/V5_LOG_REVIEW.md; fi
          if [ -f notebooks/baselines/v5_version5.ipynb ]; then git add notebooks/baselines/v5_version5.ipynb; fi
          if [ -f reports/V5_OUTPUT_INVENTORY.json ]; then git add reports/V5_OUTPUT_INVENTORY.json; fi
          if [ -f reports/V5_VERSION5_SOURCE_REVIEW.md ]; then git add reports/V5_VERSION5_SOURCE_REVIEW.md; fi
          if [ -f reports/V5_IDENTITY.json ]; then git add reports/V5_IDENTITY.json; fi
          if [ -f reports/OFFICIAL_EVALUATOR_EXCERPTS.md ]; then git add reports/OFFICIAL_EVALUATOR_EXCERPTS.md; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record sanitized V5 source access diagnostics [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
