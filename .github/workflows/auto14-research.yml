name: Solar 14-day adaptive research (bounded Kaggle GPU)

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auto14-research.yml'
      - 'scripts/run_auto14_daily.py'
      - 'scripts/build_auto14_notebook.py'
      - 'tests/test_auto14.py'

permissions:
  contents: write

concurrency:
  group: solar-fourteen-day-one-gpu
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 145
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE }}
      KAGGLE_USERNAME: minahussain111
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify plan and generated notebook without GPU
        run: |
          python -m pip install pytest==8.3.4
          python -m pytest -q tests/test_auto14.py
      - name: Install the pinned Kaggle CLI
        run: python -m pip install 'git+https://github.com/Kaggle/kaggle-cli.git@2076e087da9fb8186636d2fe4d8c9f8cf6c56ac9'
      - name: One private, quota-gated GPU training day (no submission)
        run: python scripts/run_auto14_daily.py --retry-failed
      - name: Save aggregate training status only (never weights, private data, or tokens)
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ ! -f reports/AUTO14_STATE.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/AUTO14_STATE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record bounded private Kaggle experiment [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Research summary and notebook links
        if: ${{ always() }}
        run: |
          echo '## Solar fourteen-day research' >> "$GITHUB_STEP_SUMMARY"
          echo 'GPU quota-aware, one job/day, dates 24 Oct to 6 Nov 2026 (UTC).' >> "$GITHUB_STEP_SUMMARY"
          echo 'Validation scores are LOCAL and do not establish official competition PQ.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Check reports/AUTO14_STATE.json and private Kaggle notebooks solar-autoresearch-d01…d14.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No automatic official submission, use of test labels, or checkpoint overwriting.' >> "$GITHUB_STEP_SUMMARY"
