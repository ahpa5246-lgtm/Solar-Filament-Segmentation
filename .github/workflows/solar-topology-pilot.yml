name: Continue original V5 toward official PQ 0.50

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/solar-topology-pilot.yml'
      - 'scripts/run_v5_finetune.py'
permissions:
  contents: write
concurrency:
  group: solar-fourteen-day-one-gpu
  cancel-in-progress: false
jobs:
  finetune:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE }}
      OMP_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify continuation guards and notebook before GPU request
        run: |
          python -m pip install pytest==8.3.4
          python -m pytest -q tests/test_v5_finetune.py
          python scripts/build_v5_finetune.py --output /tmp/v5-preflight/finetune.ipynb
      - name: Install pinned official Kaggle client
        run: python -m pip install 'git+https://github.com/Kaggle/kaggle-cli.git@2076e087da9fb8186636d2fe4d8c9f8cf6c56ac9'
      - name: Launch one preserved-architecture training job
        id: launch
        run: python -u scripts/run_v5_finetune.py --launch
      - name: Publish immutable launch identity before monitoring
        if: ${{ always() }}
        run: |
          if [ ! -f reports/V5_FINETUNE_STATE.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/V5_FINETUNE_STATE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record immutable V5 training launch intent [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Monitor same training version and retrieve measured result
        if: ${{ steps.launch.outcome == 'success' }}
        run: python -u scripts/run_v5_finetune.py --monitor
      - name: Preserve measured training result even on failure
        if: ${{ always() }}
        run: |
          if [ ! -f reports/V5_FINETUNE_STATE.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/V5_FINETUNE_STATE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record real V5 continuation status and measurements [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

