name: Continue original V5 toward official PQ 0.50

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/solar-topology-pilot.yml'
      - 'scripts/run_v5_finetune.py'
      - 'scripts/run_v5_interpolation.py'
      - 'scripts/run_v5_hardnegative.py'
permissions:
  contents: write
concurrency:
  group: solar-fourteen-day-one-gpu
  cancel-in-progress: false
jobs:
  finetune:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE }}
      OMP_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify continuation guards and notebook before GPU request
        run: |
          python -m pip install pytest==8.3.4
          python -m pytest -q tests/test_v5_finetune.py
          python scripts/build_v5_finetune.py --output /tmp/v5-preflight/finetune.ipynb
      - name: Install pinned official Kaggle client
        run: python -m pip install 'git+https://github.com/Kaggle/kaggle-cli.git@2076e087da9fb8186636d2fe4d8c9f8cf6c56ac9'
      - name: Launch one preserved-architecture training job
        id: launch
        run: python -u scripts/run_v5_finetune.py --launch
      - name: Publish immutable launch identity before monitoring
        if: ${{ always() }}
        run: |
          if [ ! -f reports/V5_FINETUNE_STATE.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/V5_FINETUNE_STATE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record immutable V5 training launch intent [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Monitor same training version and retrieve measured result
        if: ${{ steps.launch.outcome == 'success' }}
        run: python -u scripts/run_v5_finetune.py --monitor
      - name: Preserve measured training result even on failure
        if: ${{ always() }}
        run: |
          if [ ! -f reports/V5_FINETUNE_STATE.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/V5_FINETUNE_STATE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record real V5 continuation status and measurements [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main


  interpolation:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[launch-v5-hardnegative]') && !contains(github.event.head_commit.message, '[launch-v5-headonly]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE }}
      OMP_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify immutable v2 and interpolation software
        run: |
          python -m pip install pytest==8.3.4
          python -m pip install torch==2.6.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pytest -q tests/test_v5_weight_interpolation.py
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('scripts').resolve()))
          from build_v5_interpolation import build
          state=json.loads(Path('reports/V5_FINETUNE_STATE.json').read_text())
          result=state['result']
          assert state['version']==2 and state['status']=='COMPLETE'
          assert result['best_epoch']==0 and result['epochs_completed']==16
          build(Path('/tmp/v5-interpolation-preflight/interpolation.ipynb'),result['best_checkpoint_sha256'])
          PY
      - name: Install pinned official Kaggle CLI
        run: python -m pip install 'git+https://github.com/Kaggle/kaggle-cli.git@2076e087da9fb8186636d2fe4d8c9f8cf6c56ac9'
      - name: Launch one interpolation inference experiment
        id: launch
        run: python -u scripts/run_v5_interpolation.py --phase launch
      - name: Preserve immutable launch intent
        if: ${{ always() }}
        run: |
          if [ ! -f reports/V5_INTERPOLATION_STATE.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/V5_INTERPOLATION_STATE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record V5 interpolation immutable Kaggle intent [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Retrieve same version without relaunch
        if: ${{ steps.launch.outcome == 'success' }}
        run: python -u scripts/run_v5_interpolation.py --phase monitor
      - name: Preserve measured local result
        if: ${{ always() }}
        run: |
          if [ ! -f reports/V5_INTERPOLATION_STATE.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/V5_INTERPOLATION_STATE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record V5 interpolation measured outcome [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

  hardnegative:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[launch-v5-hardnegative]')
    runs-on: ubuntu-latest
    timeout-minutes: 160
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE }}
      OMP_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate train-only mining, immutable prerequisites and private notebook
        run: |
          python -m pip install pytest==8.3.4
          python -m pytest -q tests/test_v5_hardnegative.py tests/test_v5_finetune.py
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.run_v5_hardnegative import prerequisites
          from scripts.build_v5_hardnegative import build
          prerequisites(json.loads(Path('reports/V5_FINETUNE_STATE.json').read_text()),
                        json.loads(Path('reports/V5_INTERPOLATION_STATE.json').read_text()))
          build(Path('/tmp/v5-hardnegative-preflight/hardnegative.ipynb'))
          PY
      - name: Install pinned official Kaggle CLI
        run: python -m pip install 'git+https://github.com/Kaggle/kaggle-cli.git@2076e087da9fb8186636d2fe4d8c9f8cf6c56ac9'
      - name: Launch at most one immutable hard-negative V5 training version
        id: launch
        run: python -u scripts/run_v5_hardnegative.py --phase launch
      - name: Preserve API write intent and accepted version
        if: ${{ always() }}
        run: |
          if [ ! -f reports/V5_HARDNEGATIVE_STATE.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/V5_HARDNEGATIVE_STATE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record immutable V5 hard-negative launch identity [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Monitor the accepted version without another Kaggle push
        if: ${{ steps.launch.outcome == 'success' }}
        run: python -u scripts/run_v5_hardnegative.py --phase monitor
      - name: Preserve measured hard-negative result or terminal failure
        if: ${{ always() }}
        run: |
          if [ ! -f reports/V5_HARDNEGATIVE_STATE.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/V5_HARDNEGATIVE_STATE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record measured V5 hard-negative result [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

  headonly:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[launch-v5-headonly]')
    runs-on: ubuntu-latest
    timeout-minutes: 160
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE }}
      OMP_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate frozen-RPN head-only V5 experiment and source hashes
        run: |
          python -m pip install pytest==8.3.4
          python -m pytest -q tests/test_v5_headonly.py tests/test_v5_finetune.py
          python scripts/build_v5_headonly.py --output /tmp/v5-headonly-preflight/headonly.ipynb
      - name: Install pinned official Kaggle CLI
        run: python -m pip install 'git+https://github.com/Kaggle/kaggle-cli.git@2076e087da9fb8186636d2fe4d8c9f8cf6c56ac9'
      - name: Launch at most one isolated ROI-head-only V5 training version
        id: launch
        run: python -u scripts/run_v5_headonly.py --phase launch
      - name: Preserve immutable launch intent before monitoring
        if: ${{ always() }}
        run: |
          if [ ! -f reports/V5_HEADONLY_STATE.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/V5_HEADONLY_STATE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record V5 head-only immutable Kaggle intent [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Monitor accepted head-only version without another Kaggle push
        if: ${{ steps.launch.outcome == 'success' }}
        run: python -u scripts/run_v5_headonly.py --phase monitor
      - name: Preserve measured PQ and checkpoint or terminal failure
        if: ${{ always() }}
        run: |
          if [ ! -f reports/V5_HEADONLY_STATE.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/V5_HEADONLY_STATE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record measured V5 head-only result [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
