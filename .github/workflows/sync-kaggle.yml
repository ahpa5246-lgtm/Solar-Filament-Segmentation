name: Sync research notebooks to Kaggle

on:
  push:
    branches: [main]
    paths:
      - 'notebooks/optimize_v3_kaggle.ipynb'
      - 'notebooks/train_edge_v4_kaggle.ipynb'
      - 'scripts/build_v5_from_apache_reference.py'
      - 'scripts/build_v6_notebook.py'
      - 'solar/v6_*.py'
      - 'tests/test_v6.py'
      - 'notebooks/v6/**'
      - 'notebooks/solar_manual_training_ready.ipynb'
      - '.github/workflows/sync-kaggle.yml'
  workflow_dispatch:
    inputs:
      notebook:
        description: 'Which Kaggle notebook to update?'
        type: choice
        required: true
        default: both
        options:
          - both
          - v3
          - v4
          - v5
          - v6
          - manual-training

permissions:
  contents: read

concurrency:
  group: kaggle-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE }}
      RUN_TRAINING: ${{ contains(github.event.head_commit.message, '[run-solar-training]') }}
      CHOICE: ${{ github.event.inputs.notebook || 'manual-training' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scope push to new manual training notebook
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          if printf '%s\n' "$files" | grep -Eq '^(notebooks/solar_manual_training_ready\.ipynb|\.github/workflows/sync-kaggle\.yml)$'; then
            echo 'CHOICE=manual-training' >> "$GITHUB_ENV"
            echo 'Selected only manual Kaggle training notebook'
          fi
      - name: Verify Kaggle credentials exist
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "::error::Add repository secret KAGGLE containing your KGAT_ API token under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
      - name: Install official Kaggle CLI
        run: |
          # The --no-run flag is available on upstream main; some PyPI releases lack it.
          python -m pip install --upgrade 'git+https://github.com/Kaggle/kaggle-cli.git@2076e087da9fb8186636d2fe4d8c9f8cf6c56ac9'
          kaggle kernels push --help | grep -- '--no-run'
      - name: Test V5 generator against synthetic upstream drift and syntax
        if: ${{ env.CHOICE == 'both' || env.CHOICE == 'v5' }}
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_v5_builder.py -k 'not refiner_tta'
      - name: Inspect existing failed manual training version
        if: ${{ env.CHOICE == 'manual-training' }}
        run: |
          python - <<'PY'
          import json, re
          from kaggle.api.kaggle_api_extended import KaggleApi
          api = KaggleApi()
          api.authenticate()
          ref = 'minahussain111/solar-manual-training-20261027/v2'
          print('Existing notebook status:', api.kernels_status(ref))
          raw = api.kernels_logs(ref)
          try:
              decoded = json.loads(raw) if isinstance(raw, str) else raw
          except ValueError:
              decoded = raw
          full = '\n'.join(str(x.get('data','')) for x in decoded if isinstance(x,dict)) if isinstance(decoded,list) else str(decoded)
          # Print only the traceback tail; never environment variables or tokens.
          tail = full[-14000:]
          tail = re.sub(r'KGAT_[A-Za-z0-9_-]+', '[REDACTED]', tail)
          print('Log bytes:', len(full))
          print(tail)
          import tempfile, pathlib
          with tempfile.TemporaryDirectory() as folder:
              api.kernels_output(ref, folder, file_pattern=r'(auto14_result\.json|metrics\.jsonl|submission.*json)$')
              for path in pathlib.Path(folder).rglob('*'):
                  if path.is_file(): print(path.name, path.read_text()[-5000:])
          print(str(api.competitions_submissions('filament-segmentation-2026'))[:6000])
          PY
      - name: Stage notebooks and competition metadata
        run: |
          python - <<'PY'
          import json, os, pathlib, shutil
          selection = os.environ['CHOICE']
          targets = {
              'v3': ('notebooks/optimize_v3_kaggle.ipynb',
                     'solar-filament-research-v3',
                     ['minahussain111/notebookbde8e3d22c']),
              'v4': ('notebooks/train_edge_v4_kaggle.ipynb',
                     'solar-filament-research-v4', []),
              'manual-training': ('notebooks/solar_manual_training_ready.ipynb',
                                  'solar-manual-training-20261027', []),
          }
          for version, (source, slug, kernel_sources) in targets.items():
              if (selection != version and
                      not (selection == 'both' and version in ('v3','v4'))):
                  continue
              folder = pathlib.Path('kaggle-deploy') / version
              folder.mkdir(parents=True, exist_ok=True)
              filename = pathlib.Path(source).name
              shutil.copy2(source, folder / filename)
              metadata = {
                  'id': f'minahussain111/{slug}',
                  'title': slug,
                  'code_file': filename,
                  'language': 'python',
                  'kernel_type': 'notebook',
                  'is_private': True,
                  'enable_gpu': True,
                  'enable_internet': True,
                  'dataset_sources': [],
                  'competition_sources': ['filament-segmentation-2026'],
                  'kernel_sources': kernel_sources,
                  'model_sources': [],
              }
              (folder / 'kernel-metadata.json').write_text(json.dumps(metadata, indent=2))
              print('Prepared', folder, 'with competition data and kernel sources:', kernel_sources)
          PY
      - name: Build pretrained instance detector V5 from Apache-2.0 public notebook
        if: ${{ env.CHOICE == 'both' || env.CHOICE == 'v5' }}
        run: |
          set -euo pipefail
          mkdir -p upstream-v5 kaggle-deploy/v5
          # Pin upstream version 1 for reproducibility; never download competition test labels.
          kaggle kernels pull nomannic19/cv-solar-filament-mask-r-cnn-u-net-refiner/1 -p upstream-v5
          python - <<'PY'
          import ast, json, pathlib, subprocess, sys
          notebooks = list(pathlib.Path('upstream-v5').glob('*.ipynb'))
          assert len(notebooks) == 1, f'Expected one Apache notebook, got {notebooks}'
          out = pathlib.Path('kaggle-deploy/v5/solar_filament_v5_detector_refiner.ipynb')
          subprocess.run([sys.executable, 'scripts/build_v5_from_apache_reference.py',
                          '--source', str(notebooks[0]), '--output', str(out)], check=True)
          nb = json.loads(out.read_text())
          for i, cell in enumerate(nb['cells']):
              if cell['cell_type'] != 'code':
                  continue
              code = ''.join(cell['source'])
              if code.startswith('%%writefile'):
                  code = code.split('\n', 1)[1]
              elif code.startswith('!'):
                  continue
              ast.parse(code, filename=f'v5-cell-{i}')
          assert len(nb['cells']) == 18
          print('V5 notebook AST/safety checks passed')
          meta = {
              'id': 'minahussain111/solar-filament-research-v5',
              'title': 'solar-filament-research-v5',
              'code_file': out.name,
              'language': 'python',
              'kernel_type': 'notebook',
              'is_private': True,
              'enable_gpu': True,
              'enable_internet': True,
              'machine_shape': 'NvidiaTeslaT4',
              'dataset_sources': [],
              'competition_sources': ['filament-segmentation-2026'],
              'kernel_sources': [],
              'model_sources': [],
          }
          (out.parent/'kernel-metadata.json').write_text(json.dumps(meta, indent=2))
          PY
      - name: Verify V6 CPU pipeline before deployment
        if: ${{ env.CHOICE == 'both' || env.CHOICE == 'v6' }}
        run: |
          python -m pip install torch==2.6.0+cpu torchvision==0.21.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-v6.txt
          OMP_NUM_THREADS=2 python -m pytest -q
          python -m pip check
      - name: Build private V6 audit notebook (no training)
        if: ${{ env.CHOICE == 'both' || env.CHOICE == 'v6' }}
        run: |
          python scripts/build_v6_notebook.py --output kaggle-deploy/v6/solar_filament_v6.ipynb
      - name: Collect immutable V5 Version 5 source and current official evaluation for review
        if: ${{ env.CHOICE == 'v6' }}
        run: |
          mkdir -p v6-review/v5-version-5 v6-review/official-evaluation
          kaggle kernels pull minahussain111/solar-filament-research-v5/v5 -p v6-review/v5-version-5
          kaggle kernels pull azimahmadzadeh/self-evaluation-notebook -p v6-review/official-evaluation
      - name: Retain V6 source audit inputs
        if: ${{ env.CHOICE == 'v6' }}
        uses: actions/upload-artifact@v4
        with:
          name: v6-source-audit
          path: v6-review/
          retention-days: 14
      - name: Push selected notebook and optionally start authorized training
        run: |
          set -euo pipefail
          for metadata in kaggle-deploy/*/kernel-metadata.json; do
            folder="$(dirname "$metadata")"
            echo "Syncing $folder (NO GPU RUN)"
            if [ "$CHOICE" = manual-training ] && [ "$RUN_TRAINING" = true ]; then
              kaggle kernels push -p "$folder"
            else
              kaggle kernels push -p "$folder" --no-run
            fi
          done
      - name: Show links
        run: |
          echo "### Kaggle notebooks updated (not executed)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CHOICE" = both ] || [ "$CHOICE" = v3 ]; then
            echo "- [V3](https://www.kaggle.com/code/minahussain111/solar-filament-research-v3)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$CHOICE" = both ] || [ "$CHOICE" = v4 ]; then
            echo "- [V4](https://www.kaggle.com/code/minahussain111/solar-filament-research-v4)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$CHOICE" = both ] || [ "$CHOICE" = v5 ]; then
            echo "- [V5: pretrained Mask R-CNN + U-Net](https://www.kaggle.com/code/minahussain111/solar-filament-research-v5)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$CHOICE" = both ] || [ "$CHOICE" = v6 ]; then
            echo "- [V6: audit first, no training by default](https://www.kaggle.com/code/minahussain111/solar-filament-research-v6)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$CHOICE" = manual-training ]; then
            echo '- [Manual GPU training notebook](https://www.kaggle.com/code/minahussain111/solar-manual-training-20261027)' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Review the Kaggle notebook, enable Internet if needed, then use Save Version > Save & Run All." >> "$GITHUB_STEP_SUMMARY"
