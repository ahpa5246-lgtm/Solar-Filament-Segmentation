name: Sync research notebooks to Kaggle (no GPU run)

on:
  push:
    branches: [main]
    paths:
      - 'notebooks/optimize_v3_kaggle.ipynb'
      - 'notebooks/train_edge_v4_kaggle.ipynb'
      - '.github/workflows/sync-kaggle.yml'
  workflow_dispatch:
    inputs:
      notebook:
        description: 'Which Kaggle notebook to update?'
        type: choice
        required: true
        default: both
        options:
          - both
          - v3
          - v4

permissions:
  contents: read

concurrency:
  group: kaggle-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      CHOICE: ${{ github.event.inputs.notebook || 'both' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Kaggle credentials exist
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            echo "::error::Add repository secrets KAGGLE_USERNAME and KAGGLE_KEY under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
      - name: Install official Kaggle CLI
        run: python -m pip install --upgrade kaggle
      - name: Stage notebooks and competition metadata
        run: |
          python - <<'PY'
          import json, os, pathlib, shutil
          selection = os.environ['CHOICE']
          targets = {
              'v3': ('notebooks/optimize_v3_kaggle.ipynb',
                     'solar-filament-research-v3',
                     ['minahussain111/notebookbde8e3d22c']),
              'v4': ('notebooks/train_edge_v4_kaggle.ipynb',
                     'solar-filament-research-v4', []),
          }
          for version, (source, slug, kernel_sources) in targets.items():
              if selection not in ('both', version):
                  continue
              folder = pathlib.Path('kaggle-deploy') / version
              folder.mkdir(parents=True, exist_ok=True)
              filename = pathlib.Path(source).name
              shutil.copy2(source, folder / filename)
              metadata = {
                  'id': f'minahussain111/{slug}',
                  'title': slug,
                  'code_file': filename,
                  'language': 'python',
                  'kernel_type': 'notebook',
                  'is_private': True,
                  'enable_gpu': True,
                  'enable_internet': True,
                  'dataset_sources': [],
                  'competition_sources': ['filament-segmentation-2026'],
                  'kernel_sources': kernel_sources,
                  'model_sources': [],
              }
              (folder / 'kernel-metadata.json').write_text(json.dumps(metadata, indent=2))
              print('Prepared', folder, 'with competition data and kernel sources:', kernel_sources)
          PY
      - name: Push notebook code without starting a GPU run
        run: |
          set -euo pipefail
          for metadata in kaggle-deploy/*/kernel-metadata.json; do
            folder="$(dirname "$metadata")"
            echo "Syncing $folder (NO GPU RUN)"
            kaggle kernels push -p "$folder" --no-run
          done
      - name: Show links
        run: |
          echo "### Kaggle notebooks updated (not executed)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CHOICE" = both ] || [ "$CHOICE" = v3 ]; then
            echo "- [V3](https://www.kaggle.com/code/minahussain111/solar-filament-research-v3)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$CHOICE" = both ] || [ "$CHOICE" = v4 ]; then
            echo "- [V4](https://www.kaggle.com/code/minahussain111/solar-filament-research-v4)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Review the Kaggle notebook, enable Internet if needed, then use Save Version > Save & Run All." >> "$GITHUB_STEP_SUMMARY"
