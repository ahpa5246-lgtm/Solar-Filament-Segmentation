name: Score selected V5 continuation on Kaggle
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/auto14-final.yml','scripts/run_v5_final_assessment.py']
permissions:
  contents: write
concurrency:
  group: solar-fourteen-day-one-gpu
  cancel-in-progress: false
jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE }}
      OMP_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official client and independent RLE validator
        run: python -m pip install 'git+https://github.com/Kaggle/kaggle-cli.git@2076e087da9fb8186636d2fe4d8c9f8cf6c56ac9' pytest==8.3.4 numpy==2.2.6 pycocotools==2.0.11
      - name: Check final assessment packaging and eligibility guards
        run: python -m pytest -q tests/test_v5_finalfit.py
      - name: Fit full training data, infer all test images, submit once and verify official score
        run: python -u scripts/run_v5_final_assessment.py
      - name: Preserve official result or ambiguous request identity
        if: ${{ always() }}
        run: |
          if [ ! -f reports/V5_FINAL_ASSESSMENT.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/V5_FINAL_ASSESSMENT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record V5 full fit, CSV hash and Kaggle official assessment [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
