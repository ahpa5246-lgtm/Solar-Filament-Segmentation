name: Solar AutoResearch final held-out confirmation and official delivery

on:
  schedule:
    # A single calendar date (also UTC); code verifies exact YEAR to prevent future reuse.
    - cron: '31 5 7 11 *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auto14-final.yml'
      - 'scripts/build_auto14_final_notebook.py'
      - 'solar/auto14_upgrade.py'
      - 'solar/auto14_geometry.py'

permissions:
  contents: write

concurrency:
  group: solar-auto14-final-once
  cancel-in-progress: false

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 145
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE }}
      KAGGLE_USERNAME: minahussain111
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify immutable final-scoring contract
        run: |
          python -m pip install pytest==8.3.4
          python -m pytest -q tests/test_auto14.py tests/test_auto14_final.py
      - name: Install the official pinned Kaggle client
        run: python -m pip install 'git+https://github.com/Kaggle/kaggle-cli.git@2076e087da9fb8186636d2fe4d8c9f8cf6c56ac9'
      - name: November 7 single sealed confirmation and guarded official upload
        run: python scripts/run_auto14_final.py
      - name: Preserve public metric and status only; never export private predictions or secrets
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ ! -f reports/AUTO14_FINAL.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/AUTO14_FINAL.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record independent candidate confirmation and official evaluation [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Show results locations
        if: ${{ always() }}
        run: |
          echo '## One-shot final validation and submission, Nov 7 2026 UTC' >> "$GITHUB_STEP_SUMMARY"
          echo 'Official score, if received, is in reports/AUTO14_FINAL.json and Kaggle Submissions.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Private candidate CSV, if generated, is in solar-autoresearch-final-2026 Kaggle notebook outputs.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No training or user data/test ground truth is published by this workflow.' >> "$GITHUB_STEP_SUMMARY"
