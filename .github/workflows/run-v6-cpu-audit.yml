name: Execute V6 CPU audit on Kaggle (no GPU)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-v6-cpu-audit.yml'
      - 'scripts/build_v6_replay_notebook.py'
      - 'scripts/run_v6_cpu_audit.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v6-cpu-audit
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned official CLI
        run: python -m pip install 'git+https://github.com/Kaggle/kaggle-cli.git@2076e087da9fb8186636d2fe4d8c9f8cf6c56ac9'
      - name: Run one CPU-only replay with a ten-minute server timeout
        run: python scripts/run_v6_cpu_audit.py
      - name: Persist aggregate execution evidence
        if: ${{ always() }}
        run: |
          if [ ! -f reports/V6_KAGGLE_CPU_EXECUTION.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/V6_KAGGLE_CPU_EXECUTION.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Kaggle CPU replay execution evidence [skip ci]"
          git push origin HEAD:main
