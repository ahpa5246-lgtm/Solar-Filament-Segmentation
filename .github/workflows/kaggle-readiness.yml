name: Kaggle official score and real CSV readiness (read-only)
# Recheck the accelerated Kaggle day-two run after ABI-preflight deployment.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kaggle-readiness.yml'
      - 'scripts/kaggle_readiness_probe.py'
      - 'tests/test_kaggle_readiness_probe.py'

permissions:
  contents: write

concurrency:
  group: solar-kaggle-readiness-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE }}
      KAGGLE_USERNAME: minahussain111
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Kaggle client and RLE verification
        run: |
          python -m pip install pytest==8.3.4 numpy==1.26.4 pycocotools==2.0.8
          python -m pip install 'git+https://github.com/Kaggle/kaggle-cli.git@2076e087da9fb8186636d2fe4d8c9f8cf6c56ac9'
      - name: Verify CPU reference RLE vectors and never-submit contract
        run: python -m pytest -q tests/test_kaggle_readiness_probe.py
      - name: Check authenticated Kaggle score and real V5 submission file
        run: python scripts/kaggle_readiness_probe.py
      - name: Record only newer sanitized evidence without stale-report rebase conflicts
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f reports/KAGGLE_READINESS.json ]; then exit 0; fi
          cp reports/KAGGLE_READINESS.json "$RUNNER_TEMP/solar-local-audit.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git show origin/main:reports/KAGGLE_READINESS.json > "$RUNNER_TEMP/solar-remote-audit.json" || echo '{}' > "$RUNNER_TEMP/solar-remote-audit.json"
            if ! python - "$RUNNER_TEMP/solar-local-audit.json" "$RUNNER_TEMP/solar-remote-audit.json" <<'PY'
          import datetime as dt
          import json
          import sys
          def stamp(path):
              try:
                  value = json.load(open(path)).get("snapshot_utc")
                  return dt.datetime.fromisoformat(value) if value else dt.datetime.min.replace(tzinfo=dt.timezone.utc)
              except (OSError, ValueError, TypeError):
                  return dt.datetime.min.replace(tzinfo=dt.timezone.utc)
          sys.exit(0 if stamp(sys.argv[1]) > stamp(sys.argv[2]) else 1)
          PY
            then
              echo 'A newer or identical Kaggle audit is already recorded; skip stale report.'
              exit 0
            fi
            git reset --hard origin/main
            cp "$RUNNER_TEMP/solar-local-audit.json" reports/KAGGLE_READINESS.json
            git add reports/KAGGLE_READINESS.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Record Kaggle competition readiness evidence [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
          done
          echo 'Audit completed but GitHub branch advanced during three safe retries.'
          exit 1
      - name: Explain official status
        if: always()
        run: |
          echo '## Real Kaggle submission readiness' >> "$GITHUB_STEP_SUMMARY"
          echo 'Read-only: no competition submission was attempted.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A valid prior V5 CSV does not establish a new trained model.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Review reports/KAGGLE_READINESS.json for official score inventory and RLE check.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This audit re-fetches current official submission scores; local tuning PQ remains separate.' >> "$GITHUB_STEP_SUMMARY"
