name: Kaggle official score and real CSV readiness (read-only)
# Recheck the accelerated Kaggle day-two run after ABI-preflight deployment.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kaggle-readiness.yml'
      - 'scripts/kaggle_readiness_probe.py'
      - 'tests/test_kaggle_readiness_probe.py'

permissions:
  contents: write

concurrency:
  group: solar-kaggle-readiness-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE }}
      KAGGLE_USERNAME: minahussain111
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Kaggle client and RLE verification
        run: |
          python -m pip install pytest==8.3.4 numpy==1.26.4 pycocotools==2.0.8
          python -m pip install 'git+https://github.com/Kaggle/kaggle-cli.git@2076e087da9fb8186636d2fe4d8c9f8cf6c56ac9'
      - name: Verify CPU reference RLE vectors and never-submit contract
        run: python -m pytest -q tests/test_kaggle_readiness_probe.py
      - name: Check authenticated Kaggle score and real V5 submission file
        run: python scripts/kaggle_readiness_probe.py
      - name: Record sanitized score and status evidence only
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f reports/KAGGLE_READINESS.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/KAGGLE_READINESS.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record Kaggle competition readiness evidence [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Explain official status
        if: always()
        run: |
          echo '## Real Kaggle submission readiness' >> "$GITHUB_STEP_SUMMARY"
          echo 'Read-only: no competition submission was attempted.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A valid prior V5 CSV does not establish a new trained model.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Review reports/KAGGLE_READINESS.json for official score inventory and RLE check.' >> "$GITHUB_STEP_SUMMARY"
