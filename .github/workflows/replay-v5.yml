name: Replay cached V5 validation (CPU only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replay-v5.yml'
      - 'scripts/replay_v5_cached.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU replay dependencies
        run: |
          python -m pip install 'git+https://github.com/Kaggle/kaggle-cli.git@2076e087da9fb8186636d2fe4d8c9f8cf6c56ac9' numpy==1.26.4 scipy==1.13.1 opencv-python-headless==4.10.0.84 pycocotools==2.0.8
          python -m pip install -e . --no-deps
      - name: Replay cached masks against official TRAIN annotations
        run: python scripts/replay_v5_cached.py
      - name: Persist aggregate metrics only
        if: ${{ always() }}
        run: |
          if [ ! -f reports/V5_CACHED_REPLAY.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/V5_CACHED_REPLAY.json
          if [ -f notebooks/baselines/v5_training_session_v3.ipynb ]; then git add notebooks/baselines/v5_training_session_v3.ipynb; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record aggregate cached V5 validation replay [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
