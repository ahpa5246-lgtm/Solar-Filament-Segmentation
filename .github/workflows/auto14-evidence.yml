name: Compile public evidence handoff after AutoResearch final assessment

on:
  schedule:
    # GITHUB_TOKEN commits from another workflow do not trigger push workflows.
    - cron: '09 5 8 11 *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'reports/AUTO14_FINAL.json'
      - '.github/workflows/auto14-evidence.yml'

permissions:
  contents: write

concurrency:
  group: solar-auto14-evidence
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate report schema and anti-hallucination rules
        run: |
          python -m pip install pytest==8.3.4
          python -m pytest -q tests/test_auto14_evidence_report.py
      - name: Generate attributable public research evidence
        run: python scripts/auto14_evidence_report.py
      - name: Commit generated report (never checkpoints or test labels)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/AUTO14_EVIDENCE_REPORT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update final scientific research evidence handoff [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
