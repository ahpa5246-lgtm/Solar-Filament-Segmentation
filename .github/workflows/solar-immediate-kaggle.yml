name: Solar immediate Kaggle leaderboard evaluation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/solar-immediate-kaggle.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: solar-immediate-kaggle-once
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 145
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE }}
      KAGGLE_USERNAME: minahussain111
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify final notebook contract
        run: |
          python -m pip install pytest==8.3.4
          python -m pytest -q tests/test_auto14_final.py
      - name: Install Kaggle CLI
        run: python -m pip install 'git+https://github.com/Kaggle/kaggle-cli.git@2076e087da9fb8186636d2fe4d8c9f8cf6c56ac9'
      - name: Run one independent confirmation and conditional official submission
        run: python scripts/run_auto14_immediate.py
      - name: Persist sanitized evaluation report
        if: always()
        run: |
          if [ ! -f reports/AUTO14_IMMEDIATE_20261027.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/AUTO14_IMMEDIATE_20261027.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record immediate Kaggle confirmation and leaderboard outcome [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
