name: Bounded V6 resolution inference audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/resolution-audit.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v6-resolution-inference
  cancel-in-progress: false
jobs:
  infer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE }}
      KAGGLE_USERNAME: minahussain111
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned official CLI
        run: python -m pip install 'git+https://github.com/Kaggle/kaggle-cli.git@2076e087da9fb8186636d2fe4d8c9f8cf6c56ac9'
      - name: Run one private inference experiment with quota and timeout guards
        run: python scripts/run_v6_resolution_audit.py
      - name: Persist aggregate metrics only
        if: ${{ always() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ ! -f reports/V6_KAGGLE_RESOLUTION_EXECUTION.json ]; then exit 0; fi
          git add reports/V6_KAGGLE_RESOLUTION_EXECUTION.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record bounded V6 resolution inference metrics [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
