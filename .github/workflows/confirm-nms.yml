name: Verify current Kaggle training and official submission scores
on:
  push:
    branches: [main]
    paths: ['.github/workflows/confirm-nms.yml','scripts/observe_kaggle_current.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v6-fixed-nms-confirmation
  cancel-in-progress: true
jobs:
  infer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE }}
      KAGGLE_USERNAME: minahussain111
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned official CLI
        run: python -m pip install 'git+https://github.com/Kaggle/kaggle-cli.git@2076e087da9fb8186636d2fe4d8c9f8cf6c56ac9' pytest==8.3.4
      - name: Verify V5 recovery guards before any GPU request
        run: python -m pytest -q tests/test_v5_recovery.py tests/test_auto14.py
      - name: Run one private inference experiment with quota and timeout guards
        run: python scripts/observe_kaggle_current.py
      - name: Persist aggregate metrics only
        if: ${{ always() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ ! -f reports/KAGGLE_CURRENT_EVIDENCE.json ]; then exit 0; fi
          git add reports/KAGGLE_CURRENT_EVIDENCE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record live Kaggle execution and official submission evidence [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
